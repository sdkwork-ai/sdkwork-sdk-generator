[package]
rust-version.workspace = true
name = "sdkwork-api-sdk-generator-assembly"
edition = "2021"
version = "0.1.0"
description = "Generated API assembly for sdkwork-sdk-generator application HTTP plane."


[lints]
workspace = true
[lib]
name = "sdkwork_api_sdk_generator_assembly"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
sdkwork-web-bootstrap = { workspace = true }
sdkwork-web-core = { workspace = true }
